name: CoMaps iCloud candidate
on:
  push:
    branches: [main, om-reuse-regressions, ios-library-features, ios-saved-items]
  workflow_dispatch:
    inputs:
      lab:
        description: Verify the separate CoMaps Lab application
        type: boolean
        default: false
      lab_upload:
        description: Also sign and upload CoMaps Lab to internal TestFlight (paid Developer Program required)
        type: boolean
        default: false
      lab_local:
        description: Build local-only Lab IPA for free-account signing (no iCloud or TestFlight)
        type: boolean
        default: false
      lab_mac:
        description: Build a direct local Mac Catalyst app without Apple credentials
        type: boolean
        default: false
      saved_items_proposals:
        description: Verify search and both manual-order proposals independently
        type: boolean
        default: false
      saved_items_feature:
        description: Independent proposal to verify
        type: choice
        default: all
        options: [all, search, folder-order, item-order]
      release:
        description: Build an unsigned Release archive after regression tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: comaps-icloud-${{ github.ref }}${{ inputs.lab_mac && '-mac' || '' }}${{ inputs.saved_items_proposals && format('-proposals-{0}', inputs.saved_items_feature || 'all') || '' }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  saved-items-proposals:
    if: github.event_name == 'workflow_dispatch' && inputs.saved_items_proposals
    uses: ./.github/workflows/saved-items-proposals.yml
    with:
      feature: ${{ inputs.saved_items_feature || 'all' }}

  mac-lab:
    if: github.event_name == 'workflow_dispatch' && inputs.lab_mac && !inputs.saved_items_proposals
    uses: ./.github/workflows/mac.yml
    with:
      upload_requested: ${{ inputs.lab_upload }}

  lab:
    if: github.event_name == 'workflow_dispatch' && !inputs.saved_items_proposals && !inputs.lab_mac && (inputs.lab || inputs.lab_local)
    uses: ./.github/workflows/lab.yml
    with:
      upload: ${{ inputs.lab_upload }}
      local_only: ${{ inputs.lab_local }}
    secrets: inherit

  file-pipeline:
    if: github.event_name != 'workflow_dispatch' || (!inputs.lab && !inputs.lab_local && !inputs.lab_mac && !inputs.saved_items_proposals)
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Exercise original and candidate file pipelines
        shell: bash
        run: sh verify.sh | tee pipeline-results.txt
      - name: Report scope and results
        if: always()
        run: |
          printf '%s\n' 'Synthetic file-pipeline results; no live iCloud testing.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The metadata-only difference case documents an unresolved limitation.' >> "$GITHUB_STEP_SUMMARY"
          printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat pipeline-results.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

  ios:
    if: github.event_name != 'workflow_dispatch' || (!inputs.lab && !inputs.lab_local && !inputs.lab_mac && !inputs.saved_items_proposals)
    needs: file-pipeline
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Inspect the preinstalled Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available
          df -h .
      - name: Ensure the Metal toolchain is available
        run: |
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -k
          fi
          xcrun metal -v
      - name: Check and install required build tools
        run: |
          for formula in wget optipng cmake ninja qt jq coreutils gnu-getopt icu4c; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
          printf '%s\n' "$(brew --prefix gnu-getopt)/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          printf '%s\n' "$(brew --prefix icu4c)/bin" >> "$GITHUB_PATH"
      - name: Fetch and configure the pinned CoMaps revision
        run: bash ci/prepare-upstream.sh
      - name: Build and execute bookmark persistence regression tests
        env:
          CORE_CHECK_BASELINE: ${{ github.ref_name == 'ios-saved-items' && '0' || '1' }}
        run: bash ci/test-core.sh
      - name: Reproduce the previous incoming-file race with a native control
        if: github.ref_name == 'ios-saved-items'
        run: bash ci/test-incoming-control.sh
      - name: Build and execute saved-item search compatibility tests
        if: github.ref_name == 'ios-saved-items'
        run: bash ci/test-search.sh
      - name: Build iOS and execute the new regression tests
        run: bash ci/test-ios.sh
      - name: Export hosted simulator screen images
        if: always() && github.ref_name == 'ios-saved-items'
        continue-on-error: true
        run: |
          if [ -d results/CoMaps-Debug-Tests.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path results/CoMaps-Debug-Tests.xcresult \
              --output-path results/ui-attachments
          fi
      - name: Keep only small simulator images
        if: always() && github.ref_name == 'ios-saved-items'
        uses: actions/upload-artifact@v7
        with:
          name: bookmarks-ui-smoke
          path: |
            results/ui-attachments/**/*.png
            results/ui-attachments/**/*.jpg
            results/ui-attachments/**/*.jpeg
            results/ui-attachments/manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build an unsigned Release archive
        if: github.event_name != 'workflow_dispatch' || inputs.release
        working-directory: comaps
        run: |
          xcodebuild archive \
            -workspace xcode/CoMaps.xcworkspace \
            -scheme CoMaps \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/comaps-derived-data" \
            -archivePath "$RUNNER_TEMP/CoMaps-Release.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Summarize XCTest results
        if: always()
        run: |
          printf '%s\n' 'iOS build and simulator regression results (not live iCloud synchronization).' >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/core-summary.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat results/core-summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f results/CoMaps-Debug-Tests.xcresult/Info.plist ]; then
            xcrun xcresulttool get test-results summary --path results/CoMaps-Debug-Tests.xcresult > results/summary.json
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat results/summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
